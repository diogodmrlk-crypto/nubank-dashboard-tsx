name: Build Native iOS Wrapper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies and Build Vite
        run: |
          npm install
          npm run build

      - name: Install XcodeGen and ImageMagick
        run: |
          brew install xcodegen
          brew install imagemagick

      - name: Prepare iOS Files and Icon
        run: |
          rm -f index.html
          cp dist/index.html .
          
          # 1. Pega a imagem, tira a transparência e força fundo roxo
          magick assets/images/lfXCNiz.png -background "#820ad1" -alpha remove -alpha off -resize 1024x1024^ -gravity center -extent 1024x1024 icon.png
          magick icon.png -resize 120x120 AppIcon60x60@2x.png
          magick icon.png -resize 180x180 AppIcon60x60@3x.png
          
          # 2. Configura o Info.plist
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>pt_BR</string>
              <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
              <key>CFBundleDisplayName</key><string>Nubank</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>10.0</string>
              <key>CFBundleVersion</key><string>10</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
              <key>NSAppTransportSecurity</key>
              <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
              <key>UIViewControllerBasedStatusBarAppearance</key><false/>
              <key>UIStatusBarHidden</key><false/>
              <key>UIStatusBarStyle</key><string>UIStatusBarStyleLightContent</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIMainStoryboardFile</key>
              <string></string>
              <key>UIBackgroundModes</key>
              <array><string>remote-notification</string></array>
              
              <!-- FORÇA O GBOX A LER O ÍCONE -->
              <key>CFBundleIconFiles</key>
              <array>
                  <string>AppIcon60x60</string>
                  <string>icon</string>
              </array>
          </dict>
          </plist>
          EOF

          # 3. Cria o projeto
          cat << 'EOF' > project.yml
          name: NubankApp
          options:
            bundleIdPrefix: com.wesley
          targets:
            NubankApp:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: AppDelegate.swift
                - path: index.html
                - path: icon.png
                - path: AppIcon60x60@2x.png
                - path: AppIcon60x60@3x.png
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.wesley.nubankapp.v10
                  INFOPLIST_FILE: Info.plist
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
                  INFOPLIST_KEY_UIMainStoryboardFile: ""
                  INFOPLIST_KEY_UILaunchStoryboardName: ""
          EOF

          xcodegen generate

      - name: Build Archive (No Signing)
        run: |
          set -e
          xcodebuild -project NubankApp.xcodeproj \
            -scheme NubankApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          set -e
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/App.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          # Copia as imagens direto pra raiz do .app (onde o GBox procura)
          cp NubankApp.app/icon.png Payload/NubankApp.app/icon.png 2>/dev/null || true
          cp NubankApp.app/AppIcon60x60@2x.png Payload/NubankApp.app/ 2>/dev/null || true
          zip -r Nubank.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nubank-IPA
          path: ${{ runner.temp }}/Nubank.ipa

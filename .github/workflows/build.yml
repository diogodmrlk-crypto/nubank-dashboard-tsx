name: Build Native iOS Wrapper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies and Build Vite
        run: |
          npm install
          npm run build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare iOS Files
        run: |
          # Limpa qualquer resquício
          rm -f index.html
          cp dist/index.html .
          
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>pt_BR</string>
              <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
              <key>CFBundleDisplayName</key><string>Nubank V2</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>2.0</string>
              <key>CFBundleVersion</key><string>2</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
              <key>NSAppTransportSecurity</key>
              <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
              <key>UIViewControllerBasedStatusBarAppearance</key><false/>
              <key>UIStatusBarHidden</key><false/>
              <key>UIStatusBarStyle</key><string>UIStatusBarStyleLightContent</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>NSFaceIDUsageDescription</key>
              <string>Use o Face ID para acessar sua conta com segurança.</string>
          </dict>
          </plist>
          EOF

          # ATENÇÃO: Criei o V2 no ID para não usar cache
          cat << 'EOF' > project.yml
          name: NubankApp
          options:
            bundleIdPrefix: com.wesley
          targets:
            NubankApp:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: AppDelegate.swift
                - path: index.html
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.wesley.nubankapp.v2
                  INFOPLIST_FILE: Info.plist
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
                  ASSETCATALOG_COMPILER_APPICON_NAME: ""
          EOF

          xcodegen generate

      - name: Build Archive (No Signing)
        run: |
          set -e
          xcodebuild -project NubankApp.xcodeproj \
            -scheme NubankApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          set -e
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/App.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          # NOME NOVO DO ARQUIVO
          zip -r NubankApp_v2.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nubank-Native-IPA-v2
          path: ${{ runner.temp }}/NubankApp_v2.ipa

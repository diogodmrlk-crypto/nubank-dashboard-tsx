name: Build Nubank TSX to IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build React App (Vite)
        run: npm run build

      - name: Setup Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Inject Network & Permissions to Info.plist
        run: |
          PLIST_PATH="ios/App/App/Info.plist"
          # Permite conexões de rede (evita tela branca no GBox)
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" $PLIST_PATH || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" $PLIST_PATH || true
          
          # Permissões padrão de câmera (caso o app peça)
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Precisamos da câmera para ler QR Codes'" $PLIST_PATH || true

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build Archive (No Signing)
        run: |
          set -e
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Clean up metadata and Package IPA
        run: |
          set -e
          # Remove lixos do Mac que fazem o GBox falhar
          find $RUNNER_TEMP/App.xcarchive -name ".DS_Store" -delete
          find $RUNNER_TEMP/App.xcarchive -name "_MACOSX" -delete
          
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/App.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          
          # Empacota o IPA
          zip -r NubankDashboard.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nubank-Unsigned-IPA
          path: ${{ runner.temp }}/NubankDashboard.ipa

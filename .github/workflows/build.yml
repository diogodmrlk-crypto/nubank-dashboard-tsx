name: Build Native iOS Wrapper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies and Build Vite
        run: |
          npm install
          npm run build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create XcodeGen project.yml
        run: |
          cat << 'EOF' > project.yml
          name: NubankApp
          options:
            bundleIdPrefix: com.wesley
          targets:
            NubankApp:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources: [AppDelegate.swift]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.wesley.nubankapp
                  INFOPLIST_FILE: Info.plist
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
                  ASSETCATALOG_COMPILER_APPICON_NAME: ""
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Copy Vite Build to iOS Project
        run: |
          # Copia o conteúdo da pasta dist para a raiz do build do iOS
          mkdir -p NubankApp
          cp -R dist/* NubankApp/

      - name: Build Archive (No Signing)
        run: |
          set -e
          xcodebuild -project NubankApp.xcodeproj \
            -scheme NubankApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          set -e
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/App.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r NubankNative.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nubank-Native-IPA
          path: ${{ runner.temp }}/NubankNative.ipa
